name: CI
run-name: "CI [${{ github.event_name }}]"

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  setup:
    name: Resolve Toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node_version: ${{ steps.toolchain.outputs.node_version }}
      pnpm_version: ${{ steps.toolchain.outputs.pnpm_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve toolchain from package.json
        id: toolchain
        uses: ./.github/actions/resolve-toolchain

  quality:
    name: Lint and format checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup
    env:
      NODE_VERSION: ${{ needs.setup.outputs.node_version }}
      PNPM_VERSION: ${{ needs.setup.outputs.pnpm_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run quality gate
        uses: ./.github/actions/quality-gate

  security:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ["setup", "quality"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test --all-projects

  e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ["setup", "quality"]
    env:
      NODE_VERSION: ${{ needs.setup.outputs.node_version }}
      PNPM_VERSION: ${{ needs.setup.outputs.pnpm_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Playwright tests
        uses: ./.github/actions/playwright
